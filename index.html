<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amisha Juice & Fast Food - Premium</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"><style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0f172a;
  color: white;
}

header {
  padding: 20px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(10px);
  position: fixed;
  width: 100%;
  top: 0;
  z-index: 1000;
}

nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

nav h2 {
  color: #f97316;
}

nav ul {
  display: flex;
  gap: 20px;
  list-style: none;
}

nav a {
  color: white;
  text-decoration: none;
}

.hero {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  background: linear-gradient(135deg,#f97316,#ef4444);
}

.hero h1 {
  font-size: 3rem;
}

.btn {
  padding: 12px 25px;
  background: black;
  border-radius: 8px;
  margin-top: 20px;
  display: inline-block;
  cursor: pointer;
}

section {
  padding: 80px 20px;
  max-width: 1100px;
  margin: auto;
}

.menu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
  gap: 20px;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 15px;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
}

.order-box {
  background: #1e293b;
  padding: 20px;
  border-radius: 10px;
}

input, select {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  border-radius: 5px;
  border: none;
}

footer {
  text-align: center;
  padding: 20px;
  background: black;
}
</style></head><body><header>
<nav>
<h2>Amisha</h2>
<ul>
<li><a href="#">Home</a></li>
<li><a href="#menu">Menu</a></li>
<li><a href="#order">Order</a></li>
</ul>
</nav>
</header><div class="hero">
<div>
<h1>Street Food That Hits Different 🍜</h1>
<p>Fast • Fresh • Affordable</p>
<div class="btn" onclick="scrollToMenu()">Explore Menu</div>
</div>
</div><section id="menu">
<h2>🔥 Menu</h2>
<div class="menu-grid">
<div class="card">Chicken Curry + Paratha - ₹150</div>
<div class="card">Mix Non Veg Chowmein - ₹120</div>
<div class="card">Mix Chowmein - ₹100</div>
<div class="card">Fresh Juice - ₹80</div>
</div>
</section><section id="order">
<h2>🛒 Order Now</h2>
<div class="order-box">
<input type="text" id="name" placeholder="Your Name">
<select id="item">
<option>Chicken Curry + Paratha</option>
<option>Mix Non Veg Chowmein</option>
<option>Mix Chowmein</option>
<option>Fresh Juice</option>
</select>
<input type="number" id="qty" placeholder="Quantity">
<div class="btn" onclick="placeOrder()">Place Order (WhatsApp)</div>
</div>
</section><footer>
© 2026 Amisha Juice & Fast Food
</footer><script>
function scrollToMenu() {
  document.getElementById('menu').scrollIntoView({behavior:'smooth'});
}

function placeOrder() {
  let name = document.getElementById('name').value;
  let item = document.getElementById('item').value;
  let qty = document.getElementById('qty').value;

  let message = `Hello, I want to order:\nName: ${name}\nItem: ${item}\nQuantity: ${qty}`;

  let url = `https://wa.me/918092547265?text=${encodeURIComponent(message)}`;
  window.open(url, '_blank');
}
</script></body>
</html>
